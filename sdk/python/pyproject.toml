[project]
name = "weft"
version = "0.1.0"
description = "Minimal Python SDK for emitting OTLP GenAI spans to a Weft-compatible collector."
requires-python = ">=3.10"
dependencies = ["opentelemetry-proto"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["weft"]
